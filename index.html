<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人引导页</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #0b0e1a 0%, #1a1e2f 45%, #2d2b4a 100%);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== 背景装饰光晕 ===== */
        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: -20%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.15) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            right: -20%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, rgba(245, 87, 108, 0.12) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ===== 主容器 ===== */
        .container {
            position: relative;
            z-index: 1;
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px 40px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 48px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
        }

        /* ===== 头部标题 ===== */
        .brand {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.25);
            margin-bottom: 12px;
            user-select: none;
            text-transform: uppercase;
            font-weight: 300;
        }
        .brand span {
            color: rgba(255, 255, 255, 0.5);
        }

        /* ===== 时间组件 ===== */
        .time-wrapper {
            text-align: center;
            padding: 20px 10px 18px;
            width: 100%;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 32px;
        }

        .time-date {
            font-size: 17px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .time-clock {
            font-size: 64px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 4px;
            text-shadow: 0 0 30px rgba(102, 126, 234, 0.25), 0 0 60px rgba(102, 126, 234, 0.08);
            line-height: 1.2;
            font-variant-numeric: tabular-nums;
        }

        .time-clock .seconds {
            font-size: 32px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.4);
            margin-left: 2px;
        }

        .time-weekday {
            font-size: 15px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 4px;
            letter-spacing: 2px;
        }

        /* ===== 四宫格按钮 ===== */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            width: 100%;
            margin-top: 6px;
        }

        .grid-btn {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            aspect-ratio: 1 / 1;
            width: 100%;
            border-radius: 24px;
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            font-size: 22px;
            letter-spacing: 1px;
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            border: none;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            padding: 16px;
        }

        /* 每个按钮的渐变背景（覆盖） */
        .grid-btn .btn-bg {
            position: absolute;
            inset: 0;
            border-radius: 24px;
            opacity: 0.75;
            transition: opacity 0.4s ease;
            z-index: 0;
        }

        .grid-btn .btn-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .grid-btn .btn-label {
            font-size: inherit;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
            letter-spacing: 1px;
        }

        /* ---- 各按钮配色 ---- */
        .btn-1 .btn-bg {
            background: linear-gradient(145deg, #4f6ef7, #7c5cfc);
        }
        .btn-2 .btn-bg {
            background: linear-gradient(145deg, #0acf97, #2dd4a8);
        }
        .btn-3 .btn-bg {
            background: linear-gradient(145deg, #f7a04f, #f57c5a);
        }
        .btn-4 .btn-bg {
            background: linear-gradient(145deg, #e870a8, #f5576c);
        }

        /* ---- 悬停 & 点击效果 ---- */
        .grid-btn:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .grid-btn:hover .btn-bg {
            opacity: 1;
        }

        .grid-btn:active {
            transform: translateY(-2px) scale(0.96);
            transition-duration: 0.08s;
        }

        /* ===== 底部 ===== */
        .footer {
            margin-top: 36px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 1px;
            user-select: none;
            font-weight: 300;
        }
        .footer a {
            color: rgba(255, 255, 255, 0.2);
            text-decoration: none;
            transition: color 0.3s;
        }
        .footer a:hover {
            color: rgba(255, 255, 255, 0.5);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 500px) {
            .container {
                padding: 22px 16px 30px;
                border-radius: 32px;
            }

            .time-clock {
                font-size: 48px;
                letter-spacing: 2px;
            }
            .time-clock .seconds {
                font-size: 24px;
            }
            .time-date {
                font-size: 15px;
            }

            .grid {
                gap: 14px;
            }

            .grid-btn {
                font-size: 18px;
            }

            .brand {
                font-size: 16px;
            }
        }

        @media (max-width: 380px) {
            .time-clock {
                font-size: 38px;
            }
            .time-clock .seconds {
                font-size: 18px;
            }
            .grid {
                gap: 10px;
            }
            .grid-btn {
                font-size: 16px;
            }
            .container {
                padding: 16px 12px 24px;
                border-radius: 24px;
            }
        }

        /* ===== 小彩蛋：呼吸光晕 ===== */
        @keyframes pulseGlow {
            0%,
            100% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
        }
        .grid-btn:hover .btn-bg {
            animation: pulseGlow 1.8s ease-in-out infinite;
        }

        /* 点击波纹效果 */
        .grid-btn .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
            z-index: 2;
        }
        @keyframes rippleAnim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* ============================================================
              密码弹窗样式
              ============================================================ */
        /* 遮罩层 */
        .password-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            /* 默认隐藏 */
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 20px;
            animation: fadeIn 0.25s ease;
        }

        .password-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: scale(0.96);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* 弹窗卡片 */
        .password-dialog {
            width: 100%;
            max-width: 380px;
            padding: 32px 28px 28px;
            background: rgba(20, 24, 40, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .password-dialog .dialog-title {
            font-size: 22px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .password-dialog .dialog-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 24px;
            letter-spacing: 0.3px;
        }

        .password-dialog .dialog-input {
            width: 100%;
            padding: 14px 18px;
            font-size: 16px;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: #ffffff;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            box-sizing: border-box;
        }

        .password-dialog .dialog-input:focus {
            border-color: rgba(10, 207, 151, 0.5);
            box-shadow: 0 0 0 3px rgba(10, 207, 151, 0.15);
        }

        .password-dialog .dialog-input::placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-weight: 300;
        }

        .password-dialog .dialog-error {
            font-size: 14px;
            color: #f5576c;
            min-height: 28px;
            margin-top: 10px;
            transition: opacity 0.3s;
            opacity: 0;
            visibility: hidden;
        }

        .password-dialog .dialog-error.show {
            opacity: 1;
            visibility: visible;
        }

        .password-dialog .dialog-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .password-dialog .dialog-actions button {
            flex: 1;
            padding: 12px 0;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .password-dialog .btn-confirm {
            background: linear-gradient(145deg, #0acf97, #2dd4a8);
            color: #fff;
            box-shadow: 0 8px 20px rgba(10, 207, 151, 0.25);
        }

        .password-dialog .btn-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(10, 207, 151, 0.35);
        }

        .password-dialog .btn-confirm:active {
            transform: translateY(0px);
        }

        .password-dialog .btn-cancel {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .password-dialog .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
        }

        /* 弹窗响应式 */
        @media (max-width: 420px) {
            .password-dialog {
                padding: 24px 20px 22px;
                border-radius: 22px;
            }
            .password-dialog .dialog-title {
                font-size: 19px;
            }
            .password-dialog .dialog-input {
                padding: 12px 14px;
                font-size: 15px;
            }
            .password-dialog .dialog-actions button {
                font-size: 14px;
                padding: 10px 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- 品牌标识 -->
        <div class="brand">✦ <span>导航</span></div>

        <!-- ===== 时间组件 ===== -->
        <div class="time-wrapper">
            <div class="time-date" id="dateDisplay">2026年7月31日 星期五</div>
            <div class="time-clock">
                <span id="hours">00</span>:<span id="minutes">00</span>:<span class="seconds" id="seconds">00</span>
            </div>
            <div class="time-weekday" id="weekdayDisplay">☀️ 美好的一天</div>
        </div>

        <!-- ===== 四宫格按钮 ===== -->
        <div class="grid">

            <!-- 按钮 1：网盘 -->
            <a href="http://cntwo.wanwr.com:30167" target="_blank" rel="noopener noreferrer" class="grid-btn btn-1">
                <span class="btn-bg"></span>
                <span class="btn-content">
                    <span class="btn-label">网盘</span>
                </span>
            </a>

            <!-- 按钮 2：飞牛（带密码保护） -->
            <a href="#" class="grid-btn btn-2" id="studyBtn">
                <span class="btn-bg"></span>
                <span class="btn-content">
                    <span class="btn-label">飞牛</span>
                </span>
            </a>

            <!-- 按钮 3：待定 -->
            <a href="http://cntwo.wanwr.com:30169" target="_blank" rel="noopener noreferrer" class="grid-btn btn-3">
                <span class="btn-bg"></span>
                <span class="btn-content">
                    <span class="btn-label">待定代码525</span>
                </span>
            </a>

            <!-- 按钮 4：待定 -->
            <a href="https://123.com" target="_blank" rel="noopener noreferrer" class="grid-btn btn-4">
                <span class="btn-bg"></span>
                <span class="btn-content">
                    <span class="btn-label">待定代码533</span>
                </span>
            </a>

        </div>

        <!-- 底部 -->
        <div class="footer">
            <a href="" target="_blank" rel="noopener noreferrer"></a> &nbsp;&nbsp; 个人引导页
        </div>

    </div>

    <!-- ============================================================
    密码弹窗 HTML
    ============================================================ -->
    <div class="password-overlay" id="passwordOverlay">
        <div class="password-dialog" id="passwordDialog">
            <div class="dialog-title">🔐 请输入密码</div>
            <div class="dialog-subtitle">访问「学习」需要验证身份</div>

            <input type="password" class="dialog-input" id="passwordInput"
            placeholder="请输入密码..." autocomplete="off" />

            <div class="dialog-error" id="passwordError">❌ 密码错误，请重试</div>

            <div class="dialog-actions">
                <button class="btn-cancel" id="passwordCancel">取消</button>
                <button class="btn-confirm" id="passwordConfirm">确认</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  1. 实时时钟
        // ============================================================
        function updateClock() {
            const now = new Date();

            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('hours').textContent = hh;
            document.getElementById('minutes').textContent = mm;
            document.getElementById('seconds').textContent = ss;

            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const wd = weekdays[now.getDay()];

            document.getElementById('dateDisplay').textContent =
                `${year}年${month}月${day}日 ${wd}`;

            const tips = ['🌙 夜深了新新', '🌅 早安新新', '☀️ 上午好新新', '🌤️ 下午好新新', '🌇 傍晚好新新', '🌃 晚上好新新'];
            const hour = now.getHours();
            let tipIndex = 0;
            if (hour >= 6 && hour < 9) tipIndex = 1;
            else if (hour >= 9 && hour < 12) tipIndex = 2;
            else if (hour >= 12 && hour < 18) tipIndex = 3;
            else if (hour >= 18 && hour < 20) tipIndex = 4;
            else if (hour >= 20 || hour < 6) tipIndex = 5;
            document.getElementById('weekdayDisplay').textContent = tips[tipIndex];
        }

        updateClock();
        setInterval(updateClock, 1000);

        // ============================================================
        //  2. 点击波纹效果
        // ============================================================
        document.querySelectorAll('.grid-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const rect = this.getBoundingClientRect();
                const ripple = document.createElement('span');
                ripple.className = 'ripple';
                const size = Math.max(rect.width, rect.height);
                ripple.style.width = ripple.style.height = size + 'px';
                const x = e.clientX - rect.left - size / 2;
                const y = e.clientY - rect.top - size / 2;
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 700);
            });
        });

        // ============================================================
        //  4. 密码保护功能（学习按钮）
        // ============================================================

        // ---------- 配置 ----------
        // ★ 在这里修改密码 ★
        const STUDY_PASSWORD = 'fhc18977952328';

        // ---------- DOM 引用 ----------
        const studyBtn = document.getElementById('studyBtn');
        const overlay = document.getElementById('passwordOverlay');
        const passwordInput = document.getElementById('passwordInput');
        const errorMsg = document.getElementById('passwordError');
        const confirmBtn = document.getElementById('passwordConfirm');
        const cancelBtn = document.getElementById('passwordCancel');

        let pendingResolve = null; // 用于 resolve 当前验证 Promise

        // ---------- 工具函数 ----------
        function openDialog() {
            overlay.classList.add('active');
            passwordInput.value = '';
            errorMsg.classList.remove('show');
            // 聚焦输入框（需要等动画完成）
            setTimeout(() => passwordInput.focus(), 100);
            // 返回一个 Promise，在密码验证通过或取消时 resolve
            return new Promise((resolve) => {
                pendingResolve = resolve;
            });
        }

        function closeDialog() {
            overlay.classList.remove('active');
            pendingResolve = null;
        }

        function verifyPassword(input) {
            return input === STUDY_PASSWORD;
        }

        function showError() {
            errorMsg.classList.add('show');
            passwordInput.value = '';
            passwordInput.focus();
            // 轻微抖动效果
            passwordInput.style.animation = 'none';
            setTimeout(() => {
                passwordInput.style.animation = 'shake 0.3s ease';
            }, 10);
        }

        function handleConfirm() {
            const input = passwordInput.value;
            if (verifyPassword(input)) {
                // 密码正确 → 关闭弹窗，跳转
                closeDialog();
                // 打开目标链接
                window.open('http://cntwo.wanwr.com:30168', '_blank');
            } else {
                showError();
            }
        }

        function handleCancel() {
            closeDialog();
        }

        // ---------- 事件绑定 ----------

        // 点击学习按钮 → 打开密码弹窗
        studyBtn.addEventListener('click', function(e) {
            e.preventDefault(); // 阻止默认跳转
            openDialog();
        });

        // 确认按钮
        confirmBtn.addEventListener('click', handleConfirm);

        // 取消按钮
        cancelBtn.addEventListener('click', handleCancel);

        // 输入框按回车 → 确认
        passwordInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleConfirm();
            }
            if (e.key === 'Escape') {
                e.preventDefault();
                handleCancel();
            }
        });

        // 点击遮罩 → 取消
        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) {
                handleCancel();
            }
        });

        // ---------- 添加抖动动画（CSS 动态注入） ----------
        const styleSheet = document.createElement('style');
        styleSheet.textContent = `
                    @keyframes shake {
                        0%, 100% { transform: translateX(0); }
                        20% { transform: translateX(-8px); }
                        40% { transform: translateX(8px); }
                        60% { transform: translateX(-6px); }
                        80% { transform: translateX(6px); }
                    }
                `;
        document.head.appendChild(styleSheet);

        // ---------- 控制台提示 ----------
        console.log('%c🌟 个人引导页 (纯文字按钮 + 学习按钮密码保护)', 'font-size:24px; font-weight:bold; color:#7c5cfc;');
        console.log('%c点击「学习」按钮需要密码，默认密码: study2026', 'font-size:14px; color:#0acf97;');
        console.log('%c💡 如需修改密码，请搜索 STUDY_PASSWORD 变量', 'font-size:14px; color:#f7a04f;');
    </script>

</body>
</html>
