<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2eb">
  <meta name="color-scheme" content="light">
  <meta name="format-detection" content="telephone=no">
  <title>视频教程</title>

  <script>
    /* ==========================================================
       只改这里：一行一个视频
       格式：[ "显示的课程文字", "B 站视频链接" ]
       链接可以填完整地址，也可以只填 BV 号。
       ========================================================== */
    const introText = "新新";
    const videoLinks = [
      ["课程标题 1", "https://www.bilibili.com/video/BV1xxxxxxxxx"],
      ["课程标题 2", "https://www.bilibili.com/video/BV1xxxxxxxxx"],
      ["课程标题 3", "https://www.bilibili.com/video/BV1xxxxxxxxx"],
      ["课程标题 4", "https://www.bilibili.com/video/BV1xxxxxxxxx"],
      ["课程标题 5", "https://www.bilibili.com/video/BV1xxxxxxxxx"],
      ["课程标题 6", "https://www.bilibili.com/video/BV1xxxxxxxxx"]
    ];
  </script>

  <style>
    :root {
      --paper: #f5f2eb;
      --card: #fffdf8;
      --ink: #1a1c1e;
      --muted: #74716b;
      --line: rgba(26, 28, 30, 0.10);
      --pink: #fb7299;
      --radius: 15px;
      --ease: cubic-bezier(0.22, 0.8, 0.25, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      padding:
        calc(env(safe-area-inset-top) + 1.15rem)
        max(1rem, env(safe-area-inset-right))
        calc(env(safe-area-inset-bottom) + 1.5rem)
        max(1rem, env(safe-area-inset-left));
      color: var(--ink);
      background:
        radial-gradient(32rem 22rem at 100% 0%, rgba(251, 114, 153, 0.09), transparent 70%),
        radial-gradient(28rem 20rem at 0% 100%, rgba(0, 174, 236, 0.06), transparent 70%),
        var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    ::selection {
      background: rgba(251, 114, 153, 0.25);
    }

    body.is-intro {
      overflow: hidden;
    }

    .page {
      width: min(100%, 42rem);
      margin: 0 auto;
      opacity: 1;
      transform: translateY(0);
      transition:
        opacity 0.62s var(--ease),
        transform 0.62s var(--ease);
    }

    body.is-intro .page {
      opacity: 0;
      transform: translateY(14px);
    }

    body.is-entered .page {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 0.1s;
    }

    .intro {
      position: fixed;
      inset: 0;
      z-index: 100;
      overflow: hidden;
      background:
        radial-gradient(40rem 28rem at 12% 8%, rgba(251, 114, 153, 0.12), transparent 66%),
        radial-gradient(36rem 26rem at 90% 92%, rgba(0, 174, 236, 0.10), transparent 68%),
        #101214;
      opacity: 1;
      transition: opacity 0.55s var(--ease) 0.16s;
    }

    .intro.is-leaving {
      opacity: 0;
      pointer-events: none;
    }

    .intro.is-skipping {
      transition-duration: 0.22s;
    }

    .intro__glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(82vw, 52rem);
      aspect-ratio: 2 / 1;
      background: radial-gradient(
        ellipse at center,
        rgba(251, 114, 153, 0.20) 0%,
        rgba(0, 174, 236, 0.07) 44%,
        transparent 72%
      );
      filter: blur(22px);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: opacity 0.65s ease;
    }

    .intro.is-formed .intro__glow {
      opacity: 1;
    }

    .intro__canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    .video-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .video-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      width: 100%;
      min-height: 4.35rem;
      padding: 1rem 1.05rem;
      color: var(--ink);
      text-align: left;
      text-decoration: none;
      font: inherit;
      background: rgba(255, 253, 248, 0.9);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 14px 28px -30px rgba(26, 28, 30, 0.55);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      -webkit-appearance: none;
      appearance: none;
      transition:
        transform 0.22s var(--ease),
        border-color 0.22s ease,
        background-color 0.22s ease,
        box-shadow 0.22s ease;
    }

    .video-link__text {
      min-width: 0;
      font-size: 0.98rem;
      font-weight: 650;
      line-height: 1.5;
      letter-spacing: -0.005em;
      overflow-wrap: anywhere;
    }

    .video-link__arrow {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 2rem;
      height: 2rem;
      color: var(--muted);
      background: #f6f2ea;
      border: 1px solid var(--line);
      border-radius: 50%;
      transition:
        color 0.22s ease,
        background-color 0.22s ease,
        border-color 0.22s ease,
        transform 0.22s var(--ease);
    }

    .video-link__arrow svg {
      width: 0.85rem;
      height: 0.85rem;
    }

    .video-link:focus-visible {
      outline: 3px solid rgba(0, 174, 236, 0.5);
      outline-offset: 3px;
    }

    .video-link:active {
      transform: scale(0.994);
      background: #fff;
    }

    .toast {
      position: fixed;
      z-index: 10;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 1.1rem);
      width: max-content;
      max-width: calc(100vw - 2rem);
      padding: 0.68rem 1rem;
      color: #fff;
      background: rgba(26, 28, 30, 0.94);
      border-radius: 999px;
      box-shadow: 0 12px 34px -16px rgba(26, 28, 30, 0.65);
      font-size: 0.78rem;
      line-height: 1.5;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, 0.6rem);
      transition:
        opacity 0.2s ease,
        transform 0.2s var(--ease);
    }

    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (hover: hover) and (pointer: fine) {
      .video-link:hover {
        transform: translateY(-1px);
        background: #fff;
        border-color: rgba(251, 114, 153, 0.42);
        box-shadow: 0 20px 34px -30px rgba(26, 28, 30, 0.55);
      }

      .video-link:hover .video-link__arrow {
        color: #fff;
        background: var(--pink);
        border-color: var(--pink);
        transform: translate(1px, -1px);
      }
    }

    @media (min-width: 540px) {
      body {
        padding-top: calc(env(safe-area-inset-top) + 2rem);
        padding-bottom: calc(env(safe-area-inset-bottom) + 2rem);
      }

      .video-list {
        gap: 0.7rem;
      }

      .video-link {
        min-height: 4.75rem;
        padding: 1.1rem 1.2rem;
        border-radius: 16px;
      }

      .video-link__text {
        font-size: 1.03rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .video-link,
      .video-link__arrow,
      .toast,
      .page {
        transition: none;
      }

      .intro {
        display: none;
      }

      body.is-intro {
        overflow: auto;
      }

      body.is-intro .page,
      body.is-entered .page {
        opacity: 1;
        transform: none;
      }
    }
  </style>
  <noscript>
    <style>
      .intro { display: none !important; }
    </style>
  </noscript>
</head>
<body>
  <div class="intro" id="intro" aria-hidden="true">
    <div class="intro__glow"></div>
    <canvas class="intro__canvas" id="intro-canvas"></canvas>
  </div>

  <main class="page" id="main-content">
    <nav aria-label="视频教程链接">
      <ul class="video-list" id="video-list"></ul>
    </nav>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      const list = document.getElementById("video-list");
      const toast = document.getElementById("toast");
      let toastTimer;

      const arrowIcon = `
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M7 17 17 7M9 7h8v8" stroke="currentColor" stroke-width="1.9"
            stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      `;

      function normalizeUrl(value) {
        const raw = String(value || "").trim();
        if (!raw) return "";
        if (/^BV[0-9A-Za-z]+$/.test(raw)) {
          return "https://www.bilibili.com/video/" + raw;
        }
        if (/^https?:\/\//i.test(raw)) {
          return raw;
        }
        return "";
      }

      function showToast(message) {
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add("is-visible");
        toastTimer = window.setTimeout(function () {
          toast.classList.remove("is-visible");
        }, 2400);
      }

      videoLinks.forEach(function (item) {
        const text = String(item[0] || "").trim();
        const href = normalizeUrl(item[1]);
        const row = document.createElement(href ? "a" : "button");
        const li = document.createElement("li");

        row.className = "video-link";
        row.setAttribute("aria-label", text + (href ? "，在新标签页打开" : "，链接未填写"));

        if (href) {
          row.href = href;
          row.target = "_blank";
          row.rel = "noopener noreferrer";
        } else {
          row.type = "button";
          row.addEventListener("click", function () {
            showToast("这行还没有填写视频链接");
          });
        }

        const label = document.createElement("span");
        label.className = "video-link__text";
        label.textContent = text;

        const arrow = document.createElement("span");
        arrow.className = "video-link__arrow";
        arrow.setAttribute("aria-hidden", "true");
        arrow.innerHTML = arrowIcon;

        row.appendChild(label);
        row.appendChild(arrow);
        li.appendChild(row);
        list.appendChild(li);
      });
    })();
  </script>

  <script>
    (function () {
      const intro = document.getElementById("intro");
      const canvas = document.getElementById("intro-canvas");
      const main = document.getElementById("main-content");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let ctx = null;

      try {
        ctx = canvas ? canvas.getContext("2d") : null;
      } catch (error) {
        ctx = null;
      }

      function enterImmediately() {
        if (intro) intro.remove();
        document.body.classList.remove("is-intro");
        document.body.classList.add("is-entered");
        if (main) main.removeAttribute("inert");
      }

      if (!intro || !canvas || !ctx || reduceMotion) {
        enterImmediately();
        return;
      }

      const TAU = Math.PI * 2;
      const DPR = Math.min(window.devicePixelRatio || 1, 2);
      const GATHER_AT = 620;
      const FORMED_AT = 1620;
      const SCATTER_AT = 2160;
      const REVEAL_AT = 2220;
      const END_AT = 3060;

      let width = 0;
      let height = 0;
      let particles = [];
      let startTime = 0;
      let rafId = 0;
      let formedTimer = 0;
      let revealTimer = 0;
      let endTimer = 0;
      let finished = false;

      function random(min, max) {
        return min + Math.random() * (max - min);
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function easeOutCubic(value) {
        return 1 - Math.pow(1 - value, 3);
      }

      function easeOutQuad(value) {
        return 1 - Math.pow(1 - value, 2);
      }

      function buildTextTargets(count) {
        const sampleCanvas = document.createElement("canvas");
        sampleCanvas.width = Math.max(1, Math.round(width));
        sampleCanvas.height = Math.max(1, Math.round(height));

        const sampleCtx = sampleCanvas.getContext("2d", { willReadFrequently: true });
        if (!sampleCtx) return [];

        let fontSize = Math.min(width * 0.34, height * 0.36, 280);
        const fontFamily = '"PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif';
        let gap = fontSize * 0.075;
        const chars = Array.from(String(introText || "新新"));

        sampleCtx.fillStyle = "#ffffff";
        sampleCtx.textAlign = "left";
        sampleCtx.textBaseline = "middle";

        function updateTextMetrics() {
          sampleCtx.font = "900 " + fontSize + "px " + fontFamily;
          const measuredWidths = chars.map(function (char) {
            return sampleCtx.measureText(char).width;
          });
          const measuredTotal = measuredWidths.reduce(function (total, charWidth) {
            return total + charWidth;
          }, 0) + gap * Math.max(0, chars.length - 1);

          return { widths: measuredWidths, totalWidth: measuredTotal };
        }

        let metrics = updateTextMetrics();

        if (metrics.totalWidth > width * 0.78) {
          fontSize *= (width * 0.78) / metrics.totalWidth;
          gap = fontSize * 0.075;
          metrics = updateTextMetrics();
        }

        const widths = metrics.widths;
        const totalWidth = metrics.totalWidth;
        let x = (width - totalWidth) / 2;

        chars.forEach(function (char, index) {
          sampleCtx.fillText(char, x, height / 2);
          x += widths[index] + gap;
        });

        const pixels = sampleCtx.getImageData(0, 0, sampleCanvas.width, sampleCanvas.height).data;
        const step = width < 620 ? 3 : 4;
        const points = [];

        for (let sampleY = 0; sampleY < height; sampleY += step) {
          for (let sampleX = 0; sampleX < width; sampleX += step) {
            const alpha = pixels[(sampleY * sampleCanvas.width + sampleX) * 4 + 3];
            if (alpha > 150) {
              points.push([sampleX, sampleY]);
            }
          }
        }

        for (let i = points.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const temp = points[i];
          points[i] = points[j];
          points[j] = temp;
        }

        if (!points.length) {
          return [];
        }

        const targets = [];
        for (let i = 0; i < count; i++) {
          const point = points[i % points.length];
          targets.push({
            x: clamp(point[0] + random(-1.1, 1.1), 0, width),
            y: clamp(point[1] + random(-1.1, 1.1), 0, height)
          });
        }

        return targets;
      }

      function buildParticles() {
        const density = width < 620 ? 300 : 800;
        let desiredCount = Math.round((width * height) / density);
        desiredCount = clamp(desiredCount, width < 620 ? 760 : 1100, width < 620 ? 1400 : 2000);

        const aspect = width / height;
        const columns = Math.max(1, Math.round(Math.sqrt(desiredCount * aspect)));
        const rows = Math.max(1, Math.ceil(desiredCount / columns));
        const count = columns * rows;
        const cellWidth = width / columns;
        const cellHeight = height / rows;
        const targets = buildTextTargets(count);
        const centerX = width / 2;
        const centerY = height / 2;
        const scale = clamp(Math.sqrt((width * height) / (390 * 844)), 0.88, 1.25);

        if (!targets.length) {
          enterImmediately();
          finished = true;
          return;
        }

        particles = [];

        for (let i = 0; i < count; i++) {
          const column = i % columns;
          const row = Math.floor(i / columns);
          const originX = clamp((column + 0.5) * cellWidth + random(-0.4, 0.4) * cellWidth, 0, width);
          const originY = clamp((row + 0.5) * cellHeight + random(-0.4, 0.4) * cellHeight, 0, height);
          const target = targets[i];
          const roll = Math.random();
          const color = roll < 0.8 ? "#f8f5ee" : roll < 0.92 ? "#fb7299" : "#6ed7fa";
          const angle = Math.atan2(target.y - centerY, target.x - centerX) + random(-0.48, 0.48);
          const distance = Math.max(width, height) * random(0.24, 0.7);

          particles.push({
            originX: originX,
            originY: originY,
            targetX: target.x,
            targetY: target.y,
            x: originX,
            y: originY,
            color: color,
            alpha: random(0.38, 0.96),
            size: random(0.82, 1.75) * scale,
            phase: random(0, TAU),
            drift: random(3, 9),
            revealDelay: random(0, 160),
            revealDuration: random(260, 360),
            gatherDelay: random(0, 200),
            gatherDuration: random(760, 980),
            scatterX: Math.cos(angle) * distance + random(-45, 45),
            scatterY: Math.sin(angle) * distance + random(-45, 45),
            scatterDelay: random(0, 120),
            scatterDuration: random(650, 900),
            arc: random(-42, 42),
            glow: Math.random() < 0.22
          });
        }
      }

      function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.max(1, Math.round(width * DPR));
        canvas.height = Math.max(1, Math.round(height * DPR));
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }

      function finishIntro() {
        if (finished) return;
        finished = true;

        window.clearTimeout(formedTimer);
        window.clearTimeout(revealTimer);
        window.clearTimeout(endTimer);
        window.cancelAnimationFrame(rafId);

        window.removeEventListener("pointerdown", onSkip);
        window.removeEventListener("keydown", onKeydown);

        document.body.classList.add("is-entered");
        document.body.classList.remove("is-intro");
        if (main) main.removeAttribute("inert");

        if (intro) intro.remove();
      }

      function revealPage() {
        if (finished) return;
        intro.classList.add("is-formed", "is-leaving");
        document.body.classList.add("is-entered");
      }

      function onSkip() {
        finishIntro();
      }

      function onKeydown(event) {
        if (event.key === "Escape") {
          finishIntro();
        }
      }

      function drawFrame(now) {
        if (finished) return;

        const elapsed = now - startTime;
        ctx.clearRect(0, 0, width, height);

        for (let i = 0; i < particles.length; i++) {
          const particle = particles[i];
          const reveal = clamp((elapsed - particle.revealDelay) / particle.revealDuration, 0, 1);
          let alpha = particle.alpha * reveal;
          let x;
          let y;
          let size = particle.size;

          if (elapsed < GATHER_AT) {
            const driftTime = elapsed * 0.0013;
            x = particle.originX + Math.sin(driftTime + particle.phase) * particle.drift;
            y = particle.originY + Math.cos(driftTime * 0.9 + particle.phase * 1.3) * particle.drift * 0.7;
            alpha *= 0.8 + 0.2 * Math.sin(elapsed * 0.004 + particle.phase);
          } else if (elapsed < SCATTER_AT) {
            const progress = clamp(
              (elapsed - GATHER_AT - particle.gatherDelay) / particle.gatherDuration,
              0,
              1
            );
            const eased = easeOutCubic(progress);
            const driftTime = elapsed * 0.0013;
            const driftX = Math.sin(driftTime + particle.phase) * particle.drift;
            const driftY = Math.cos(driftTime * 0.9 + particle.phase * 1.3) * particle.drift * 0.7;
            const arc = Math.sin(Math.PI * eased);

            x = particle.originX + driftX * (1 - eased) + (particle.targetX - particle.originX) * eased;
            y = particle.originY + driftY * (1 - eased) + (particle.targetY - particle.originY) * eased;
            x += Math.cos(particle.phase) * particle.arc * arc;
            y += Math.sin(particle.phase) * particle.arc * arc;

            if (progress >= 1) {
              x = particle.targetX + Math.sin(elapsed * 0.0022 + particle.phase) * 0.55;
              y = particle.targetY + Math.cos(elapsed * 0.0019 + particle.phase) * 0.55;
            }
          } else {
            const progress = clamp(
              (elapsed - SCATTER_AT - particle.scatterDelay) / particle.scatterDuration,
              0,
              1
            );
            const eased = easeOutQuad(progress);
            x = particle.targetX + particle.scatterX * eased;
            y = particle.targetY + particle.scatterY * eased;
            alpha *= 1 - eased;
            size *= 1 - eased * 0.4;
          }

          if (alpha <= 0.01 || size <= 0) continue;

          particle.x = x;
          particle.y = y;

          if (particle.glow) {
            ctx.globalAlpha = alpha * 0.09;
            ctx.fillStyle = particle.color;
            ctx.beginPath();
            ctx.arc(x, y, size * 4.2, 0, TAU);
            ctx.fill();
          }

          ctx.globalAlpha = alpha;
          ctx.fillStyle = particle.color;
          ctx.beginPath();
          ctx.arc(x, y, size, 0, TAU);
          ctx.fill();
        }

        ctx.globalAlpha = 1;
        rafId = window.requestAnimationFrame(drawFrame);
      }

      document.body.classList.add("is-intro");
      if (main) main.setAttribute("inert", "");

      resizeCanvas();
      buildParticles();

      if (finished) return;

      startTime = performance.now();
      rafId = window.requestAnimationFrame(drawFrame);

      formedTimer = window.setTimeout(function () {
        intro.classList.add("is-formed");
      }, FORMED_AT);
      revealTimer = window.setTimeout(revealPage, REVEAL_AT);
      endTimer = window.setTimeout(finishIntro, END_AT);

      window.addEventListener("pointerdown", onSkip, { passive: true });
      window.addEventListener("keydown", onKeydown);
    })();
  </script>
</body>
</html>
